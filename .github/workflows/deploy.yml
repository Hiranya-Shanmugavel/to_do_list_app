name: Deploy Flutter Web to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🐦 Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: 📦 Install Project Dependencies
        run: flutter pub get

      - name: 🧪 Run Widget Tests
        run: flutter test

      - name: 🚀 Build Flutter Web Release
        env:
          FIREBASE_WEB_API_KEY: ${{ secrets.FIREBASE_WEB_API_KEY }}
        run: |
          if [ -n "$FIREBASE_WEB_API_KEY" ]; then
            echo "Building with injected FIREBASE_WEB_API_KEY secret..."
            flutter build web --release --base-href "/to_do_list_app/" --dart-define=FIREBASE_WEB_API_KEY="$FIREBASE_WEB_API_KEY"
          else
            echo "Building with DefaultFirebaseOptions configuration..."
            flutter build web --release --base-href "/to_do_list_app/"
          fi

      - name: 📄 Ensure .nojekyll exists for GitHub Pages
        run: touch build/web/.nojekyll

      - name: 🌐 Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: build/web
          branch: gh-pages
